name: Semantic Version Bump & Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic version increment (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Module Version & Tag Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Semantic Version Bump
        run: |
          node scripts/bump-version.js ${{ github.event.inputs.bump_type }}

      - name: Commit and Tag New Version
        run: |
          NEW_VER=$(cat VERSION | tr -d '[:space:]')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION composer.json modules/gateways/iugucc.php modules/gateways/iugucc/whmcs.json modules/gateways/iugucc/lib/IuguHttpClient.php modules/gateways/iugucc/templates/checkout.php
          git commit -m "chore(release): bump version to v${NEW_VER}"
          git tag -a "v${NEW_VER}" -m "Release v${NEW_VER}"
          git push origin HEAD:main --follow-tags
